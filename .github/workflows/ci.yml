name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install dependencies
        run: >-
          python -m pip install -r requirements-dev.txt -r requirements-serve.txt
          scikit-learn numpy pandas
      - run: ruff check .
      - run: pytest -q
